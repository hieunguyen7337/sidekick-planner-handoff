# HJ-19 A/B: the SAME Qwen adapter served with a prompt that matches TRAINING.
#
# Why this arm exists. hj14_sft_plan_20260924 ended 105/114 episodes on max_steps with
# ZERO actions of kind COMPLETE across 4,385 executor actions, scoring 0.2583 against the
# zero-shot floor's 0.2481 -- the same SFT recipe lifts granite's one-plan floor by +43 pp.
# The adapter IS applied (the prefix_m6 tailored and zero-shot arms are not per-episode
# identical), so "the LoRA silently missed" is not the explanation.
#
# The train/serve prompts differ, and only for Qwen. Training renders every conversation
# with apply_chat_template(..., add_generation_prompt=False) and passes NO enable_thinking
# [OBSERVED src/sidekick/training/sft_data.py:349 and :489]. Qwen3's template appends
# '<think>\n\n</think>\n\n' to the generation prompt ONLY when enable_thinking is explicitly
# defined and false [OBSERVED chat_template.jinja:84-89 in the saved adapter]. So serving
# with chat_template_kwargs.enable_thinking=false asks the adapter to continue after a
# scaffold it never saw in training, and the first token of the assistant turn -- exactly
# where the terminal-action decision is made -- is the position most disturbed.
#
# This arm removes chat_template_kwargs so the served prompt is byte-identical to the
# trained one. It changes NOTHING else: same adapter, same cached plans, same seeds, same
# limits. If the terminal action reappears, the hj14 result is a harness defect and must
# not be reported as a property of Qwen. If it does not, the mismatch is not the cause and
# the negative stands on its own.
campaign_id: hj19_prefix_m11_qwen_notk_20260924
handoff:
  source_campaign: /scratch/n12194778/sidekick/results/hj1b_planner_20260915
  source_system: planner_alone
  m: 11
# HJ-8 Class C. luna's HJ-1 plan is replayed; Qwen executes it under sft_b_plus_qwen8b.
planner:
  type: codex
  model: gpt-5.6-luna
  reasoning_effort: medium
  timeout_s: 300
  scratch_parent: /scratch/n12194778/sidekick/codex_scratch
  # Replays HJ-1 packets: this arm spends zero hosted planner calls, so every arm sees
  # the identical plan per task and plan-sampling noise is removed from the comparison.
  packet_source: /scratch/n12194778/sidekick/results/hj1b_planner_20260915
  packet_system: planner_alone
  # Load-bearing: make_planner passes this to CachedPacketPlanner. A cache miss
  # must abort, not fall through to a live Codex call.
  on_missing: fail
executor:
  type: vllm
  model: Qwen/Qwen3-8B
  base_url: http://127.0.0.1:8000
  lora_name: sft_b_plus_qwen8b  # Must equal the alias launched via --lora-modules <alias>=<path>; a mismatch means requests silently hit the BASE model and the whole evaluation measures nothing while still producing plausible numbers.
  temperature: 0.7
  max_tokens: 2048
  # See pilot_exec_8b.yaml: ends generation at the first action instead of paying for the
  # model to invent the environment's reply. Never a bare "```" -- it matches the opener.
  stop: ["</py>", "</python>", "</tool_call>"]
  timeout_s: 300  # 300s: 120s ReadTimeout-crashed 10/114 of HJ-1R arm A at 10 workers; the bound censored the slowest episodes.
  # 32768 (vLLM max_model_len) minus the 2048 generation budget above = 30720.
  # If you change executor.max_tokens, change this too: prompt + generation must
  # fit max_model_len or vLLM returns 400 and the episode crashes.
  max_prompt_tokens: 30720
limits:
  max_steps: 40
  max_tokens_per_episode: 2000000   # non-binding: max_steps=40 is the real limit.
  per_step_timeout_s: 300  # 300s: 120s ReadTimeout-crashed 10/114 of HJ-1R arm A at 10 workers; the bound censored the slowest episodes.
  # prompt_only/sft_plan calls the planner once per episode (plan_first, planner_drives=False), so
  # this is nowhere near binding here. It IS binding for planner_alone, where the planner
  # takes every step -- see docs/FOLLOWUPS.md.
  max_planner_calls: 81
prices: configs/cost/prices_2026-09.yaml

env: appworld
campaign_id: hj1c_fixed_k_20260916
# HJ-1 Class C, second arm. The cost-matched control: instead of one plan up front, the
# planner reviews every k steps. prompt_only scored 0.000 — identical to executor_alone —
# so this asks the follow-up question directly: does PERIODIC re-entry help where one-shot
# planning did not? It is also the control `sidekick` has to beat, since sidekick spends
# planner calls too and must show that spending them at *chosen* moments beats spending
# them on a fixed clock.
fixed_k: 5          # review every 5 steps; ~8 reviews + 1 plan over a 40-step episode
planner:
  type: codex
  model: gpt-5.6-luna
  reasoning_effort: medium
  timeout_s: 300
  scratch_parent: /scratch/n12194778/sidekick/codex_scratch
executor:
  type: vllm
  model: ibm-granite/granite-4.2-8b
  base_url: http://127.0.0.1:8000
  temperature: 0.7
  max_tokens: 2048
  stop: ["</py>", "</python>", "</tool_call>"]
  chat_template_kwargs:
    enable_thinking: false
  timeout_s: 120
limits:
  max_steps: 40
  max_tokens_per_episode: 2000000
  per_step_timeout_s: 120
  # ~9 planner calls per episode at k=5, so this is not binding. It IS binding for
  # planner_alone — see docs/FOLLOWUPS.md.
  max_planner_calls: 25
prices: configs/cost/prices_2026-09.yaml

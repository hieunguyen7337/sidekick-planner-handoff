# Dev control SP: the sft_plan floor with the executor's OWN plan (brief
# campaign/workers/briefs/20260924_ctrl_planning_controls.md). EXPLORATORY, DEV ONLY: not
# registered, and never a J10 arm.
# Source: configs/hj8_sft_plan_bplus.yaml
# Differs from source in: campaign_id, planner.type, planner.model, planner.base_url, planner.temperature, planner.max_tokens, planner.chat_template_kwargs.enable_thinking, planner.reasoning_effort, planner.scratch_parent, planner.packet_source, planner.packet_system, planner.on_missing
# tests/unit/test_dev_controls.py diffs the parsed YAML of both files against exactly this list.
#
# The planner is the executor itself: planner.model is the executor's LoRA alias sft_b_plus, so
# every plan (and any answer to an executor ask) comes from the weights that execute, on the one
# vLLM server that serves them. It plans live for every key -- no packet_source, so the replay keys
# (packet_system, on_missing) and the codex-only keys (reasoning_effort, scratch_parent) go. The
# vllm planner keys copy the layout of configs/lp2_hj8_sft_plan_bplus.yaml. The plan prompt is
# build_plan_prompt, the text luna's HJ-1 plans were produced with, sent under the same packet
# schema (src/sidekick/agents/vllm_planner.py). A plan that does not parse ends its episode as the
# harness already scores it (parse_error at step 0); there are no new retries.
#
# Expected hosted calls: 0. scripts/pbs/hj12_live.pbs routes this config: its planner.model equals
# executor.lora_name and ALIAS_SFT_B_PLUS, so it exports SIDEKICK_PLANNER_BASE_URL=<executor
# server>/v1 (overriding base_url below) and gates on --expect-model sft_b_plus; any other vllm
# planner is refused, because that wrapper serves no second model.
# Submit (Claude, never a worker) from the plan worktree, which hj12_live.pbs runs from:
#   qsub -v ARMS="dev_sft_plan_selfplan_bplus",DATE=20260924 /mnt/hpccs01/home/n12194778/iaes/.claude/worktrees/plan-2026-09-15/scripts/pbs/hj12_live.pbs
# DATE=20260924 is load-bearing: hj12_live names the campaign <stem>_<DATE>, which must equal
# campaign_id below.
env: appworld
campaign_id: dev_sft_plan_selfplan_bplus_20260924
# The executor plans for itself; granite executes that plan under sft_b_plus.
planner:
  # The LOCALLY SERVED planner, which is the executor: the same alias on the same server.
  type: vllm
  model: sft_b_plus
  base_url: http://127.0.0.1:8000/v1
  temperature: 0.7
  max_tokens: 2048
  timeout_s: 300
  chat_template_kwargs:
    enable_thinking: false
executor:
  type: vllm
  model: ibm-granite/granite-4.2-8b
  base_url: http://127.0.0.1:8000
  lora_name: sft_b_plus  # Must equal the alias launched via --lora-modules <alias>=<path>; a mismatch means requests silently hit the BASE model and the whole evaluation measures nothing while still producing plausible numbers.
  temperature: 0.7
  max_tokens: 2048
  # See pilot_exec_8b.yaml: ends generation at the first action instead of paying for the
  # model to invent the environment's reply. Never a bare "```" -- it matches the opener.
  stop: ["</py>", "</python>", "</tool_call>"]
  chat_template_kwargs:
    enable_thinking: false
  timeout_s: 300  # 300s: 120s ReadTimeout-crashed 10/114 of HJ-1R arm A at 10 workers; the bound censored the slowest episodes.
  # 32768 (vLLM max_model_len) minus the 2048 generation budget above = 30720.
  # If you change executor.max_tokens, change this too: prompt + generation must
  # fit max_model_len or vLLM returns 400 and the episode crashes.
  max_prompt_tokens: 30720
limits:
  max_steps: 40
  max_tokens_per_episode: 2000000   # non-binding: max_steps=40 is the real limit.
  per_step_timeout_s: 300  # 300s: 120s ReadTimeout-crashed 10/114 of HJ-1R arm A at 10 workers; the bound censored the slowest episodes.
  # prompt_only/sft_plan calls the planner once per episode (plan_first, planner_drives=False), so
  # this is nowhere near binding here. It IS binding for planner_alone, where the planner
  # takes every step -- see docs/FOLLOWUPS.md.
  max_planner_calls: 81
prices: configs/cost/prices_2026-09.yaml

# HJ-12 planner-handoff: live planner drives, may emit HANDOFF, then sft_b_plus
# finishes. No cached packet replay — this arm buys its own plan and its own steps.
env: appworld
campaign_id: hj12_planner_handoff_20260923
system: planner_handoff
handoff_allowed: true
planner:
  type: codex
  model: gpt-5.6-luna
  reasoning_effort: medium
  timeout_s: 300
  scratch_parent: /scratch/n12194778/sidekick/codex_scratch
executor:
  type: vllm
  model: ibm-granite/granite-4.2-8b
  base_url: http://127.0.0.1:8000
  lora_name: sft_b_plus  # Must equal the alias launched via --lora-modules <alias>=<path>; a mismatch means requests silently hit the BASE model and the whole evaluation measures nothing while still producing plausible numbers.
  temperature: 0.7
  max_tokens: 2048
  stop: ["</py>", "</python>", "</tool_call>"]
  chat_template_kwargs:
    enable_thinking: false
  timeout_s: 300
  max_prompt_tokens: 30720
limits:
  max_steps: 40
  max_tokens_per_episode: 2000000
  per_step_timeout_s: 300
  max_planner_calls: 81
prices: configs/cost/prices_2026-09.yaml

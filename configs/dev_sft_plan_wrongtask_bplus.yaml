# Dev control WTP: the sft_plan floor with a WRONG-TASK plan (brief
# campaign/workers/briefs/20260924_ctrl_planning_controls.md). EXPLORATORY, DEV ONLY: not
# registered, and never a J10 arm.
# Source: configs/hj8_sft_plan_bplus.yaml
# Differs from source in: campaign_id, planner.packet_task_map
# tests/unit/test_dev_controls.py diffs the parsed YAML of both files against exactly this list.
#
# planner.packet_task_map: for episode (t, s) the replay reads the HJ-1 packet of (map[t], s)
# instead of (t, s); the executor still gets task t's instruction and API docs. The map
# (scripts/setup/make_wrongtask_map.py) is the minimum-total-cost assignment on plan-length gap
# with a task's own plan and own scenario forbidden, so this arm asks whether the floor's plan
# helps through its information or through being plan-shaped text of about that length.
# src/sidekick/agents/packet_remap.py applies it; a task missing from the map is a hard error, and
# every plan event records packet_task_source.
#
# Expected hosted calls: 0 when no executor asks, as in the floor (0 ask events in 114 episodes of
# hj8_sft_plan_bplus_20260921iaware [OBSERVED]); an ASK_PLANNER would still reach live luna through
# CachedPacketPlanner.correct. The ledger counts one call per replayed plan.
# Submit (Claude, never a worker) from the plan worktree, which hj12_live.pbs runs from:
#   qsub -v ARMS="dev_sft_plan_wrongtask_bplus",DATE=20260924,MAX_PLANNER_CALLS=300 /mnt/hpccs01/home/n12194778/iaes/.claude/worktrees/plan-2026-09-15/scripts/pbs/hj12_live.pbs
# DATE=20260924 is load-bearing: hj12_live names the campaign <stem>_<DATE>, which must equal
# campaign_id below.
env: appworld
campaign_id: dev_sft_plan_wrongtask_bplus_20260924
# HJ-8 Class C. luna's HJ-1 plan is replayed; granite executes it under sft_b_plus.
planner:
  type: codex
  model: gpt-5.6-luna
  reasoning_effort: medium
  timeout_s: 300
  scratch_parent: /scratch/n12194778/sidekick/codex_scratch
  # Replays HJ-1 packets, as the source does, but the packet read for task t is map[t]'s
  # (packet_task_map below); still zero hosted calls for the plan itself.
  packet_source: /scratch/n12194778/sidekick/results/hj1b_planner_20260915
  packet_system: planner_alone
  # Load-bearing: make_planner passes this to CachedPacketPlanner. A cache miss
  # must abort, not fall through to a live Codex call.
  on_missing: fail
  # The WTP treatment: which task's packet is replayed. Repo-relative.
  packet_task_map: configs/dev_wrongtask_plan_map.json
executor:
  type: vllm
  model: ibm-granite/granite-4.2-8b
  base_url: http://127.0.0.1:8000
  lora_name: sft_b_plus  # Must equal the alias launched via --lora-modules <alias>=<path>; a mismatch means requests silently hit the BASE model and the whole evaluation measures nothing while still producing plausible numbers.
  temperature: 0.7
  max_tokens: 2048
  # See pilot_exec_8b.yaml: ends generation at the first action instead of paying for the
  # model to invent the environment's reply. Never a bare "```" -- it matches the opener.
  stop: ["</py>", "</python>", "</tool_call>"]
  chat_template_kwargs:
    enable_thinking: false
  timeout_s: 300  # 300s: 120s ReadTimeout-crashed 10/114 of HJ-1R arm A at 10 workers; the bound censored the slowest episodes.
  # 32768 (vLLM max_model_len) minus the 2048 generation budget above = 30720.
  # If you change executor.max_tokens, change this too: prompt + generation must
  # fit max_model_len or vLLM returns 400 and the episode crashes.
  max_prompt_tokens: 30720
limits:
  max_steps: 40
  max_tokens_per_episode: 2000000   # non-binding: max_steps=40 is the real limit.
  per_step_timeout_s: 300  # 300s: 120s ReadTimeout-crashed 10/114 of HJ-1R arm A at 10 workers; the bound censored the slowest episodes.
  # prompt_only/sft_plan calls the planner once per episode (plan_first, planner_drives=False), so
  # this is nowhere near binding here. It IS binding for planner_alone, where the planner
  # takes every step -- see docs/FOLLOWUPS.md.
  max_planner_calls: 81
prices: configs/cost/prices_2026-09.yaml

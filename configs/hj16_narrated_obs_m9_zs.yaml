# HJ-16 narrated prefix with observations m=9 zero-shot: planner actions and observations narrated as text in plan steps,
# untailored BASE granite executor executes in fresh environment.
# Runs under prompt_only because sft_plan.py:18 defaults adapter_name to 'sft_plan' when executor.lora_name is null (runner.py:256-258).
# Copied from configs/hj8_sft_plan_bplus.yaml; only header, campaign_id, packet_source, and lora_name differ.
env: appworld
campaign_id: hj16_narrated_obs_m9_zs_20260923
# HJ-8 Class C. luna's HJ-1 plan is replayed; granite executes it under prompt_only.
planner:
  type: codex
  model: gpt-5.6-luna
  reasoning_effort: medium
  timeout_s: 300
  scratch_parent: /scratch/n12194778/sidekick/codex_scratch
  # Replays HJ-1 packets: this arm spends zero hosted planner calls, so every arm sees
  # the identical plan per task and plan-sampling noise is removed from the comparison.
  packet_source: /scratch/n12194778/sidekick/artifacts/packets/hj16_narrated_obs_m9
  packet_system: planner_alone
  # Load-bearing: make_planner passes this to CachedPacketPlanner. A cache miss
  # must abort, not fall through to a live Codex call.
  on_missing: fail
executor:
  type: vllm
  model: ibm-granite/granite-4.2-8b
  base_url: http://127.0.0.1:8000
  lora_name: null  # Explicit no-adapter. complete() then sends model=<executor.model>. Action events: usage.model is the base id and usage.raw.lora_name is null. A dummy alias that is not in --lora-modules still hits BASE while usage.model names the alias.
  temperature: 0.7
  max_tokens: 2048
  # See pilot_exec_8b.yaml: ends generation at the first action instead of paying for the
  # model to invent the environment's reply. Never a bare "```" -- it matches the opener.
  stop: ["</py>", "</python>", "</tool_call>"]
  chat_template_kwargs:
    enable_thinking: false
  timeout_s: 300  # 300s: 120s ReadTimeout-crashed 10/114 of HJ-1R arm A at 10 workers; the bound censored the slowest episodes.
  # 32768 (vLLM max_model_len) minus the 2048 generation budget above = 30720.
  # If you change executor.max_tokens, change this too: prompt + generation must
  # fit max_model_len or vLLM returns 400 and the episode crashes.
  max_prompt_tokens: 30720
limits:
  max_steps: 40
  max_tokens_per_episode: 2000000   # non-binding: max_steps=40 is the real limit.
  per_step_timeout_s: 300  # 300s: 120s ReadTimeout-crashed 10/114 of HJ-1R arm A at 10 workers; the bound censored the slowest episodes.
  # prompt_only/sft_plan calls the planner once per episode (plan_first, planner_drives=False), so
  # this is nowhere near binding here. It IS binding for planner_alone, where the planner
  # takes every step -- see docs/FOLLOWUPS.md.
  max_planner_calls: 81
prices: configs/cost/prices_2026-09.yaml

#
# Source: configs/hj12_takeover_fixed_k_10.yaml, the takeover side of the matched-trigger pair (ledger CHAN-C1-02).
# The hosted planner (gpt-5.6-luna via codex) is replaced by the LOCALLY SERVED planner Qwen/Qwen3-8B
# from configs/lp1_planner_alone_cap81_qwen8b.yaml, to test whether the channel result holds across planner
# strength (plan 2026-09-23, unit A3). That test needs the source with the planner swapped and
# nothing else moved, so this file differs from its source ONLY in these fields -- exactly this
# set, compared on the parsed YAML by make_lp_configs.py --check and the unit test:
#   campaign_id: hj12_takeover_fixed_k_10_20260923 -> lp1_hj12_takeover_fixed_k_10_20260923
#   planner.base_url: (absent) -> http://127.0.0.1:8001/v1
#   planner.chat_template_kwargs.enable_thinking: (absent) -> false
#   planner.max_tokens: (absent) -> 2048
#   planner.model: gpt-5.6-luna -> Qwen/Qwen3-8B
#   planner.packet_source: /scratch/n12194778/sidekick/results/hj1b_planner_20260915 -> /scratch/n12194778/sidekick/results/lp1_planner_alone_cap81_qwen8b_20260923
#   planner.packet_source_pending: (absent) -> "produced by the LP-1 ceiling run (lp1_planner_alone_cap81..."
#   planner.reasoning_effort: medium -> (absent)
#   planner.scratch_parent: /scratch/n12194778/sidekick/codex_scratch -> (absent)
#   planner.temperature: (absent) -> 0.7
#   planner.type: codex -> vllm
#
# planner.packet_source moves off the hosted sample (hj1b_planner_20260915) so that every planner
#   token in an episode comes from Qwen/Qwen3-8B.
# planner.reasoning_effort / scratch_parent are codex-only; provenance would stamp them.
#
# Run with scripts/pbs/lp_live.pbs, which serves this planner and the granite executor together.
env: appworld
campaign_id: lp1_hj12_takeover_fixed_k_10_20260923
takeover: true
fixed_k: 10         # review every 10 steps; ~4 reviews + 1 cached plan over a 40-step episode
planner:
  # The LOCALLY SERVED planner. Every generation setting below is copied from configs/lp1_planner_alone_cap81_qwen8b.yaml,
  # so reviews and actions come from the same serving configuration as the plans they follow.
  # scripts/pbs/lp_live.pbs serves it on a per-job port and exports SIDEKICK_PLANNER_BASE_URL,
  # which overrides base_url (src/sidekick/runner.py::resolve_planner_base_url).
  type: vllm
  model: Qwen/Qwen3-8B
  base_url: http://127.0.0.1:8001/v1
  temperature: 0.7
  max_tokens: 2048
  timeout_s: 300
  chat_template_kwargs:
    enable_thinking: false
  # The first plan is replayed from the LP-1 ceiling itself, never from a hosted sample: a
  # hosted plan followed by local reviews would put two planners in one episode.
  packet_source: /scratch/n12194778/sidekick/results/lp1_planner_alone_cap81_qwen8b_20260923
  # verify_configs.py exempts the source only while the path is absent; once the ceiling has
  # written it, it must resolve like any other.
  packet_source_pending: produced by the LP-1 ceiling run (lp1_planner_alone_cap81_qwen8b_20260923), which may not have landed yet
  packet_system: planner_alone
  # Load-bearing: a cache miss must abort, never fall through to a live plan.
  on_missing: fail
executor:
  type: vllm
  model: ibm-granite/granite-4.2-8b
  base_url: http://127.0.0.1:8000
  lora_name: sft_b_plus  # Must equal the alias launched via --lora-modules <alias>=<path>; a mismatch means requests silently hit the BASE model and the whole evaluation measures nothing while still producing plausible numbers.
  temperature: 0.7
  max_tokens: 2048
  stop: ["</py>", "</python>", "</tool_call>"]
  chat_template_kwargs:
    enable_thinking: false
  timeout_s: 300  # 300s: 120s ReadTimeout-crashed 10/114 of HJ-1R arm A at 10 workers; the bound censored the slowest episodes.
  # 32768 (vLLM max_model_len) minus the 2048 generation budget above = 30720.
  # If you change executor.max_tokens, change this too: prompt + generation must
  # fit max_model_len or vLLM returns 400 and the episode crashes.
  max_prompt_tokens: 30720
limits:
  max_steps: 40
  max_tokens_per_episode: 2000000   # non-binding: max_steps=40 is the real limit.
  per_step_timeout_s: 300  # 300s: 120s ReadTimeout-crashed 10/114 of HJ-1R arm A at 10 workers; the bound censored the slowest episodes.
  # 81 = 2·max_steps + 1. The inherited 25 cap ended 11 of 12 `limit` episodes
  # in HJ-1; max_steps: 40 must be the binding cap.
  max_planner_calls: 81
prices: configs/cost/prices_2026-09.yaml

# J11 held-out read on test_normal, arm M^zs_6 of docs/prereg_j11_lp2_test_20260924.md §2: the
# untailored receiver (base granite, executor.lora_name null) re-runs C's first 6 actions, then continues.
# Source: configs/lp2_prefix_zs_m6.yaml
# Differs from source in: campaign_id, handoff.source_campaign, planner.packet_source, planner.packet_source_pending
# tests/unit/test_j11_configs.py diffs the parsed YAML of both files against exactly this list.
#
# ⚠ This config deliberately carries NO `split:` key. The split is a command-line
# argument (src/sidekick/runner.py:498, default "dev") and a `split:` line here would be
# silently ignored, running the confirmatory read on dev while every name said test.
# See A1 §10.2. Submit only via scripts/pbs/j11_arm.pbs, which passes --split test_normal.
#
# A prefix arm never calls plan(): the plan comes from the replayed prefix (src/sidekick/systems/loop.py:697),
# so on_missing stays fail. A planless C key replays an empty prefix (effective_m 0, handoff_occurred
# false) and the episode runs -- LP Amendment 4's rule for the prefix arms. The planner IS served:
# prefix_handoff honours executor asks (src/sidekick/systems/prefix_handoff.py:42), answered live by the
# same local planner (LP Amendment 2); j11_arm.pbs gates the arm with --allow-live-planner.
env: appworld
campaign_id: j11_prefix_zs_m6_20260924
handoff:
  source_campaign: /scratch/n12194778/sidekick/results/j11_planner_alone_cap81_qwen38_27b_20260924
  source_system: planner_alone
  m: 6
planner:
  # The LOCALLY SERVED planner whose trajectory is replayed, settings copied from configs/lp2_planner_alone_cap81_qwen38_27b.yaml.
  # It IS served during this arm: prefix_handoff honours executor asks (allow_executor_ask=True,
  # src/sidekick/systems/prefix_handoff.py:42; the ASK_PLANNER branch of loop.py:1042 calls
  # planner.correct() live), so a stuck executor's ask is answered by this same local planner,
  # as on dev. Run via scripts/pbs/j11_arm.pbs, which serves it beside the granite executor.
  type: vllm
  model: Qwen/Qwen3.8-27B-FP8
  base_url: http://127.0.0.1:8002/v1
  temperature: 0.7
  max_tokens: 2048
  timeout_s: 300
  chat_template_kwargs:
    enable_thinking: false
  # The plan is replayed from the same J11 ceiling episode as the prefix above.
  packet_source: /scratch/n12194778/sidekick/results/j11_planner_alone_cap81_qwen38_27b_20260924
  # verify_configs.py exempts the source only while the path is absent; once C has
  # written it, it must resolve like any other.
  packet_source_pending: produced by J11 arm C (j11_planner_alone_cap81_qwen38_27b_20260924, planner_alone cap-81 on test_normal), not yet run
  packet_system: planner_alone
  # Load-bearing: a cache miss must abort, never fall through to a live plan.
  on_missing: fail
executor:
  type: vllm
  model: ibm-granite/granite-4.2-8b
  base_url: http://127.0.0.1:8000
  lora_name: null  # Explicit no-adapter. complete() then sends model=<executor.model>. Action events: usage.model is the base id and usage.raw.lora_name is null. A dummy alias that is not in --lora-modules still hits BASE while usage.model names the alias.
  temperature: 0.7
  max_tokens: 2048
  # See pilot_exec_8b.yaml: ends generation at the first action instead of paying for the
  # model to invent the environment's reply. Never a bare "```" -- it matches the opener.
  stop: ["</py>", "</python>", "</tool_call>"]
  chat_template_kwargs:
    enable_thinking: false
  timeout_s: 300  # 300s: 120s ReadTimeout-crashed 10/114 of HJ-1R arm A at 10 workers; the bound censored the slowest episodes.
  # 32768 (vLLM max_model_len) minus the 2048 generation budget above = 30720.
  # If you change executor.max_tokens, change this too: prompt + generation must
  # fit max_model_len or vLLM returns 400 and the episode crashes.
  max_prompt_tokens: 30720
limits:
  max_steps: 40
  max_tokens_per_episode: 2000000   # non-binding: max_steps=40 is the real limit.
  per_step_timeout_s: 300  # 300s: 120s ReadTimeout-crashed 10/114 of HJ-1R arm A at 10 workers; the bound censored the slowest episodes.
  # prompt_only/sft_plan calls the planner once per episode (plan_first, planner_drives=False), so
  # this is nowhere near binding here. It IS binding for planner_alone, where the planner
  # takes every step -- see docs/FOLLOWUPS.md.
  max_planner_calls: 81
prices: configs/cost/prices_2026-09.yaml

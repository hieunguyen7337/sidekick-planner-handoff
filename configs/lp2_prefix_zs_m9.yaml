# LP-2 prefix-replay arm -- GENERATED by scripts/setup/make_lp_configs.py. Edit the generator, not this
# file: tests/unit/test_lp_configs.py fails on any hand edit.
#
# Source: configs/hj17_prefix_c81_zs_m9.yaml, the seeds-1,2 half of the pooled cap-81 prefix arm (ledger POOL-01).
# The hosted planner (gpt-5.6-luna via codex) is replaced by the LOCALLY SERVED planner Qwen/Qwen3.8-27B-FP8
# from configs/lp2_planner_alone_cap81_qwen38_27b.yaml, to test whether the channel result holds across planner
# strength (plan 2026-09-23, unit A3). That test needs the source with the planner swapped and
# nothing else moved, so this file differs from its source ONLY in these fields -- exactly this
# set, compared on the parsed YAML by make_lp_configs.py --check and the unit test:
#   campaign_id: hj17_prefix_c81_zs_m9_20260923 -> lp2_prefix_zs_m9_v2_20260923
#   handoff.source_campaign: /scratch/n12194778/sidekick/results/hj13_planner_alone_cap81_20260923 -> /scratch/n12194778/sidekick/results/lp2_planner_alone_cap81_qwen38_27b_20260923
#   planner.base_url: (absent) -> http://127.0.0.1:8002/v1
#   planner.chat_template_kwargs.enable_thinking: (absent) -> false
#   planner.max_tokens: (absent) -> 2048
#   planner.model: gpt-5.6-luna -> Qwen/Qwen3.8-27B-FP8
#   planner.packet_source: /scratch/n12194778/sidekick/results/hj13_planner_alone_cap81_20260923 -> /scratch/n12194778/sidekick/results/lp2_planner_alone_cap81_qwen38_27b_20260923
#   planner.packet_source_pending: (absent) -> "produced by the LP-2 ceiling run (lp2_planner_alone_cap81..."
#   planner.reasoning_effort: medium -> (absent)
#   planner.scratch_parent: /scratch/n12194778/sidekick/codex_scratch -> (absent)
#   planner.temperature: (absent) -> 0.7
#   planner.type: codex -> vllm
#
# planner.packet_source moves off the hosted sample (hj13_planner_alone_cap81_20260923) so that every planner
#   token in an episode comes from Qwen/Qwen3.8-27B-FP8.
# planner.reasoning_effort / scratch_parent are codex-only; provenance would stamp them.
# handoff.source_campaign moves with it: the replayed prefix is the LP-2 ceiling's trajectory.
# Receiver: zero-shot granite, executor.lora_name null. Depth: m=9. Both are the source's, unchanged.
#
# The planner block moves for two reasons. Provenance stamps planner.type/model into every
# manifest, and the source's codex block would file these episodes under gpt-5.6-luna when
# the replayed trajectory is Qwen/Qwen3.8-27B-FP8's. And the planner is CALLED here: prefix_handoff
# honours executor asks, so a stuck executor's ask is answered live by the same local planner,
# as hosted luna answered them in the published prefix arms.
# Run with scripts/pbs/lp_live.pbs ARMSET=lp2_prefix, which serves this planner beside the
# granite executor. campaign_id carries v2: the first ids ran with no planner server
# (hj12_prefix.pbs), every honoured ask crashed on a closed port, and those ids are VOID.
env: appworld
campaign_id: lp2_prefix_zs_m9_v2_20260923
handoff:
  source_campaign: /scratch/n12194778/sidekick/results/lp2_planner_alone_cap81_qwen38_27b_20260923
  source_system: planner_alone
  m: 9
planner:
  # The LOCALLY SERVED planner whose trajectory is replayed, settings copied from configs/lp2_planner_alone_cap81_qwen38_27b.yaml.
  # It IS served during this arm: prefix_handoff honours executor asks (allow_executor_ask=True,
  # src/sidekick/systems/prefix_handoff.py:42; the ASK_PLANNER branch of loop.py:1042 calls
  # planner.correct() live), so a stuck executor's ask is answered by this same local planner,
  # as hosted luna answered them in the published prefix arms. Run via
  # scripts/pbs/lp_live.pbs ARMSET=lp2_prefix, which serves it -- not hj12_prefix.pbs,
  # which serves no planner, so every honoured ask there crashed on a closed port (PBS 25725094).
  type: vllm
  model: Qwen/Qwen3.8-27B-FP8
  base_url: http://127.0.0.1:8002/v1
  temperature: 0.7
  max_tokens: 2048
  timeout_s: 300
  chat_template_kwargs:
    enable_thinking: false
  # The plan is replayed from the same LP-2 ceiling episode as the prefix above.
  packet_source: /scratch/n12194778/sidekick/results/lp2_planner_alone_cap81_qwen38_27b_20260923
  # verify_configs.py exempts the source only while the path is absent; once the ceiling has
  # written it, it must resolve like any other.
  packet_source_pending: produced by the LP-2 ceiling run (lp2_planner_alone_cap81_qwen38_27b_20260923), which may not have landed yet
  packet_system: planner_alone
  # Load-bearing: a cache miss must abort, never fall through to a live plan.
  on_missing: fail
executor:
  type: vllm
  model: ibm-granite/granite-4.2-8b
  base_url: http://127.0.0.1:8000
  lora_name: null  # Explicit no-adapter. complete() then sends model=<executor.model>. Action events: usage.model is the base id and usage.raw.lora_name is null. A dummy alias that is not in --lora-modules still hits BASE while usage.model names the alias.
  temperature: 0.7
  max_tokens: 2048
  # See pilot_exec_8b.yaml: ends generation at the first action instead of paying for the
  # model to invent the environment's reply. Never a bare "```" -- it matches the opener.
  stop: ["</py>", "</python>", "</tool_call>"]
  chat_template_kwargs:
    enable_thinking: false
  timeout_s: 300  # 300s: 120s ReadTimeout-crashed 10/114 of HJ-1R arm A at 10 workers; the bound censored the slowest episodes.
  # 32768 (vLLM max_model_len) minus the 2048 generation budget above = 30720.
  # If you change executor.max_tokens, change this too: prompt + generation must
  # fit max_model_len or vLLM returns 400 and the episode crashes.
  max_prompt_tokens: 30720
limits:
  max_steps: 40
  max_tokens_per_episode: 2000000   # non-binding: max_steps=40 is the real limit.
  per_step_timeout_s: 300  # 300s: 120s ReadTimeout-crashed 10/114 of HJ-1R arm A at 10 workers; the bound censored the slowest episodes.
  # prompt_only/sft_plan calls the planner once per episode (plan_first, planner_drives=False), so
  # this is nowhere near binding here. It IS binding for planner_alone, where the planner
  # takes every step -- see docs/FOLLOWUPS.md.
  max_planner_calls: 81
prices: configs/cost/prices_2026-09.yaml
